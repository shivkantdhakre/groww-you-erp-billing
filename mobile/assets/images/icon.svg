<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0F1D"/>
      <stop offset="100%" stop-color="#152238"/>
    </linearGradient>
    <linearGradient id="shimmer" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.12)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>
  
  <!-- Rounded square background -->
  <rect width="1024" height="1024" rx="180" fill="url(#bgGradient)"/>
  
  <!-- Subtle edge border -->
  <rect width="1024" height="1024" rx="180" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2"/>
  
  <!-- Top inner shimmer -->
  <ellipse cx="512" cy="160" rx="380" ry="160" fill="url(#shimmer)"/>
  
  <!-- Groww You brand mark -->
  <g transform="translate(512, 515) scale(6.4) translate(-48, -43.5)">
    <!-- Brand orange circle -->
    <circle cx="28" cy="22" r="10" fill="#F7941D"/>
    <!-- Stylized G shape -->
    <path d="M 28 38 C 22 38 14 31 8 18 C 7 15 5 10 4 7 C 6 17 12 28 22 33 L 22 80 L 34 80 L 34 33 C 44 28 50 17 52 7 C 51 10 49 15 48 18 C 42 31 34 38 28 38 Z" fill="#FFFFFF"/>
    <!-- Forward swoosh -->
    <path d="M 28 70 C 45 68 65 52 82 28 L 76 25 L 90 20 L 92 34 L 86 31 C 71 52 52 68 28 74 Z" fill="#FFFFFF"/>
    <!-- Growth bars -->
    <rect x="39" y="68" width="6" height="12" rx="1" fill="#FFFFFF"/>
    <rect x="50" y="56" width="6" height="24" rx="1" fill="#FFFFFF"/>
    <rect x="61" y="42" width="6" height="38" rx="1" fill="#FFFFFF"/>
    <rect x="72" y="26" width="6" height="54" rx="1" fill="#FFFFFF"/>
  </g>
</svg>
